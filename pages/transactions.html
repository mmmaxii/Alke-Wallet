<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Wallet - Últimos Movimientos</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


  <link rel="stylesheet" href="../assets/css/transactions.css">
</head>

<body>
  <div class="container">
    <div class="row justify-content-center align-items-center vh-100">
      <div class="col-12 col-md-6">

        <div class="card wallet-card shadow-sm">
          <div class="card-body">

            <h4 class="text-center mb-4">📊 Últimos Movimientos</h4>

            <ul class="list-group mb-3" id="listaMovimientos">
            </ul>
            <div id="paginacion-container" class="d-flex justify-content-between align-items-center mb-3">
              <button class="btn btn-sm btn-glass" id="btnAnterior" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
              </button>

              <span id="infoPagina" class="text-white font-weight-bold">Pág 1</span>

              <button class="btn btn-sm btn-glass" id="btnSiguiente">
                Siguiente <i class="fas fa-chevron-right"></i>
              </button>
            </div>

            <a class="btn btn-outline-secondary btn-block" id="btnVolver">
              Volver al Menú Principal
            </a>
            
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script src="../assets/js/transactions.js"></script>

          </div>
        </div>

      </div>
    </div>
  </div>


</body>

</html>
