<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billetera Virtual</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  
  <link rel="stylesheet" href="assets/css/index.css">
</head>

<body class="bg-gradient-purple">
  
  <div class="container">
    <div class="row justify-content-center align-items-center vh-100">
      <div class="col-12 col-sm-10 col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="text-center mb-4">Alke Wallet</h2>
            <form id="login-form">
              <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Ingresa tu email">
              </div>
              <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" minlength="8" required class="form-control" id="password"
                  placeholder="Ingresa tu contraseña">
              </div>
              <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Recordarme</label>
              </div>
              <button id="btn-ingresar" type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>



  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/index.js"></script>
  <script>  
    

  </script>
</body>

</html>
